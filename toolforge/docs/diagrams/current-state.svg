<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="900" height="470" rx="16" fill="#0d1424"/>
  <text x="450" y="46" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="700">ToolForge today = two halves of one product</text>
  <text x="450" y="74" text-anchor="middle" fill="#94a3b8" font-size="15">You already have the substance and the face — just not in the same place yet</text>

  <!-- left panel: python -->
  <rect x="40" y="100" width="380" height="270" rx="14" fill="#131c30" stroke="#26344f"/>
  <rect x="40" y="100" width="380" height="44" rx="14" fill="#0f261f"/>
  <text x="62" y="129" fill="#5eead4" font-size="19" font-weight="700">Python engine</text>
  <text x="398" y="129" text-anchor="end" fill="#2dd4bf" font-size="12" font-weight="700">REAL · no interface</text>
  <text x="62" y="182" fill="#cbd5e1" font-size="15">record.py — a vision model watches</text>
  <text x="62" y="204" fill="#cbd5e1" font-size="15">your screen and learns the steps</text>
  <text x="62" y="242" fill="#cbd5e1" font-size="15">synthesize.py — turns it into a</text>
  <text x="62" y="264" fill="#cbd5e1" font-size="15">named, reusable tool</text>
  <text x="62" y="302" fill="#cbd5e1" font-size="15">api.py / mcp_server.py — serves</text>
  <text x="62" y="324" fill="#cbd5e1" font-size="15">it as REST + MCP</text>
  <text x="62" y="356" fill="#5eead4" font-size="15" font-weight="600">&#10003; actually controls a live app</text>

  <!-- right panel: TS -->
  <rect x="480" y="100" width="380" height="270" rx="14" fill="#131c30" stroke="#26344f"/>
  <rect x="480" y="100" width="380" height="44" rx="14" fill="#2a1d10"/>
  <text x="502" y="129" fill="#fbbf24" font-size="19" font-weight="700">TS Conversion Studio</text>
  <text x="838" y="129" text-anchor="end" fill="#f59e0b" font-size="12" font-weight="700">PRETTY · simulated</text>
  <text x="502" y="182" fill="#cbd5e1" font-size="15">the polished web dashboard</text>
  <text x="502" y="204" fill="#cbd5e1" font-size="15">you liked the look of</text>
  <text x="502" y="242" fill="#cbd5e1" font-size="15">fake 4-group pipeline + canned</text>
  <text x="502" y="264" fill="#cbd5e1" font-size="15">text, scripted progress bars</text>
  <text x="502" y="302" fill="#cbd5e1" font-size="15">hardcoded "Sage UBS" demo data</text>
  <text x="502" y="356" fill="#fbbf24" font-size="15" font-weight="600">&#9888; looks real, does nothing real</text>

  <!-- caption -->
  <rect x="40" y="392" width="820" height="56" rx="12" fill="#0a1f1b" stroke="#14b8a6"/>
  <text x="450" y="417" text-anchor="middle" fill="#5eead4" font-size="15" font-weight="600">The plan: keep the substance (Python), drop the fake —</text>
  <text x="450" y="437" text-anchor="middle" fill="#5eead4" font-size="15" font-weight="600">deliver ONE installable tool that lives inside your AI agent.</text>
</svg>
